name: Ritratti leader
on:
  workflow_dispatch:
  push:
    paths: ["ritratti/elenco.json", "ritratti/scarica.py", ".github/workflows/ritratti.yml"]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "opencv-python-headless<5" numpy
      - run: python ritratti/scarica.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add ritratti
          git diff --cached --quiet || (git commit -m "Ritratti leader aggiornati" && git pull --rebase origin main && git push)
