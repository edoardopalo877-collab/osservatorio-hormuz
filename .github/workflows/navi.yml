name: Navi AIS
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: navi
  cancel-in-progress: false
jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {path: codice}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install websockets
      - name: Ramo dati
        run: |
          git clone -q --depth 1 --branch dati "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati || mkdir -p dati
      - name: Raccogli posizioni (9 minuti)
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          DURATA: "540"
        run: |
          if [ -z "$AISSTREAM_KEY" ]; then echo "Segreto AISSTREAM_KEY non ancora impostato: salto."; echo "SALTA=1" >> "$GITHUB_ENV"; exit 0; fi
          python codice/navi/raccogli.py dati/navi.json
      - name: Pubblica sul ramo dati (un solo commit, senza storico)
        if: env.SALTA != '1'
        run: |
          cd dati
          rm -rf .git
          git init -q -b dati
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add navi.json
          git commit -q -m "Navi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:dati
